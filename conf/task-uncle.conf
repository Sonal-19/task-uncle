# Task Uncle - taskuncle.com (frontend static + bun API on :4600)
# Behind the Cloudflare proxy (orange cloud). Certificate:
#   certbot certonly --webroot -w /var/www/letsencrypt -d taskuncle.com
# Older addresses (taskuncle.com, task-uncle.com.u4.lol) 301 here; see the bottom.

upstream tu_api {
    server 127.0.0.1:4600;
    keepalive 16;
}

server {
    server_name taskuncle.com;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    ssl_certificate /etc/letsencrypt/live/taskuncle.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taskuncle.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Visitors' real IPs (rate limits use X-Real-IP), not Cloudflare's.
    include /etc/nginx/snippets/cloudflare-real-ip.conf;

    root /var/www/task-uncle/front-end;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location /api/ {
        proxy_pass http://tu_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 20M;
    }

    # Web app manifest: proper MIME type (nginx mime.types has no entry for it).
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Service worker, its registration and index.html always revalidate, or
    # installed apps never see a new version.
    location ~* ^/(sw\.js|registerSW\.js|workbox-.*\.js|index\.html)$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Hashed build files never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

server {
    server_name taskuncle.com;
    listen 80;
    listen [::]:80;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# Old addresses move here. tu.u4.lol had installed apps whose service worker
# serves the cached app and never hits a redirect, so it gets a sw.js that
# unregisters itself and sends open windows to taskuncle.com
# (/var/www/task-uncle/legacy/sw.js = conf/legacy-sw.js). Its /api/ stays up
# so old tabs can still send queued changes and notification actions.
server {
    server_name tu.u4.lol;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    ssl_certificate /etc/letsencrypt/live/tu.u4.lol/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tu.u4.lol/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    include /etc/nginx/snippets/cloudflare-real-ip.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location = /sw.js {
        root /var/www/task-uncle/legacy;
        add_header Cache-Control "no-cache";
        try_files /sw.js =404;
    }

    location /api/ {
        proxy_pass http://tu_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 20M;
    }

    location / {
        return 301 https://taskuncle.com$request_uri;
    }
}

server {
    server_name tu.u4.lol;
    listen 80;
    listen [::]:80;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://taskuncle.com$request_uri;
    }
}

server {
    server_name task-uncle.com.u4.lol;
    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/task-uncle.com.u4.lol/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/task-uncle.com.u4.lol/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    return 301 https://taskuncle.com$request_uri;
}

server {
    server_name task-uncle.com.u4.lol;
    listen 80;
    listen [::]:80;
    return 301 https://taskuncle.com$request_uri;
}

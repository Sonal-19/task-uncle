<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Task Uncle">
  <defs>
    <linearGradient id="tu-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="tu-bell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#tu-bg)"/>
  <!-- reminder waves -->
  <g fill="none" stroke="#c7d2fe" stroke-width="16" stroke-linecap="round" opacity=".75">
    <path d="M118 150c-22 26-32 56-32 90"/>
    <path d="M394 150c22 26 32 56 32 90"/>
  </g>
  <!-- bell -->
  <circle cx="256" cy="106" r="20" fill="url(#tu-bell)"/>
  <path d="M256 118c-76 0-110 58-110 132v66l-30 34c-8 9-2 22 10 22h260c12 0 18-13 10-22l-30-34v-66c0-74-34-132-110-132z" fill="url(#tu-bell)"/>
  <!-- glasses -->
  <g fill="none" stroke="#312e81" stroke-width="12">
    <circle cx="213" cy="234" r="29"/>
    <circle cx="299" cy="234" r="29"/>
    <path d="M242 230q14-9 28 0" stroke-linecap="round"/>
  </g>
  <circle cx="213" cy="236" r="8" fill="#312e81"/>
  <circle cx="299" cy="236" r="8" fill="#312e81"/>
  <!-- moustache -->
  <path fill="#312e81" d="M256 284C236 266 202 264 184 281c-10 9-25 9-33-1 3 27 34 40 63 31 18-6 31-15 42-15 11 0 24 9 42 15 29 9 60-4 63-31-8 10-23 10-33 1-18-17-52-15-72 3z"/>
  <!-- clapper = done check -->
  <circle cx="256" cy="400" r="40" fill="#f59e0b" stroke="#4338ca" stroke-width="10"/>
  <path d="M238 400l12 12 24-25" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
